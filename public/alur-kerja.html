        <div class="flex gap-1.5" id="pills-container">

        </div>

        <button

        <button

        html: `

                </p>

        `
      },
      {

                </li>

          </div>
        `
      },
      {
        badge: "BAB 3 • REMOTE PRINTING",
        title: "Remote Direct Print ke Meja Kantor / Meja Operator (Rule 2)",
        subtitle: "Kirim Dokumen & Stiker Thermal Langsung dari Tengah Rak Melalui Soket TCP:9100",
        html: `
          <div class="space-y-4 text-slate-200 text-xs sm:text-sm leading-relaxed">

      },
      {
        badge: "BAB 4 • ARSITEKTUR OFFLINE-FIRST",
        title: "Ketahanan Terhadap Blind Spot Sinyal WiFi (Gudang Baja)",
        subtitle: "Aplikasi Tetap Lancar 100% Menggunakan Room Database Lokal di Memori HP",
        html: `
          <div class="space-y-4 text-slate-200 text-xs sm:text-sm leading-relaxed">
            <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
              <div class="font-bold text-emerald-400">Prinsip Kerja Saat Sinyal Putus:</div>
              <ul class="list-disc pl-5 space-y-2 text-slate-300 text-xs">
                <li><b>Master Cache di HP:</b> Data master 11 gudang sudah disimpan di memori internal HP saat awal shift.</li>
                <li><b>Scan Tanpa Internet:</b> Saat operator masuk ke area tertutup tumpukan peti baja tebal, scan barcode dan hitung fisik tetap berjalan lancar tanpa hambatan loading.</li>
                <li><b>WorkManager Auto-Sync:</b> Begitu operator keluar lorong dan HP kembali menangkap sinyal WiFi, Android WorkManager otomatis mengirim antrian data ke server tanpa perlu menekan tombol apa pun.</li>
              </ul>
            </div>
          </div>
        `
      },
      {
        badge: "BAB 5 • KALKULATOR TIMBANGAN FASTENER",
        title: "Konversi Berat Timbangan ke Pcs (Counting Scale Integration)",
        subtitle: "Solusi Nyata Menghitung Ribuan Baut / Mur Tanpa Harus Menghitung Satuan",
        html: `
          <div class="space-y-4 text-slate-200 text-xs sm:text-sm leading-relaxed">
            <div class="p-4 rounded-2xl bg-emerald-950/30 border border-emerald-900/50">
              <h4 class="font-bold text-emerald-300 mb-1">Menjawab Kebutuhan Timbangan Pabrik PT Unison</h4>
              <p>
                Satu peti atau karung berisi ribuan hingga puluhan ribu pcs mur dan baut. Aplikasi dilengkapi fitur <b>Kalkulator Timbangan Digital</b> langsung di HP operator:
              </p>
            </div>
            <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 font-mono text-xs space-y-2">
              <div class="text-amber-400 font-bold">Rumus Perhitungan Otomatis:</div>
              <div class="bg-slate-900 p-2.5 rounded-lg text-slate-300 text-[11px]">
                Qty Estimasi = (Berat Total Kotor - Tare Kemasan Karung/Peti) / Berat Sampel 100 Pcs × 100
              </div>
              <p class="text-slate-400 text-xs">
                Operator hanya perlu menimbang karung, memasukkan angka berat kotor (misal 30.5 kg), dan aplikasi otomatis mengisi jumlah fisik 2.500 pcs beserta catatan auditnya.
              </p>
            </div>
          </div>
        `
      },
      {
        badge: "BAB 6 • STRUKTUR 11 GUDANG RESMI",
        title: "Pemetaan Seluruh Fasilitas Pergudangan PT Unison Industrial Indonesia",
        subtitle: "Pelacakan Multi-Warehouse Terintegrasi",
        html: `
          <div class="space-y-3 text-xs font-mono">
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U2 GUDANG1</b><div class="text-slate-300 text-[10px]">Fastener Finishing & Packing</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U2 GUDANG2</b><div class="text-slate-300 text-[10px]">Mur & Hex Nut Storage</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U2 GUDANG3</b><div class="text-slate-300 text-[10px]">Baut Hex & Socket Stock</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U2 GUDANG4</b><div class="text-slate-300 text-[10px]">Stainless Steel (SS304/SS316)</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U2 GUDANG5</b><div class="text-slate-300 text-[10px]">Plating & Galvanizing Stock</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U2 GUDANG6</b><div class="text-slate-300 text-[10px]">Heavy Peti Wood Packaging</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U2 F29</b><div class="text-slate-300 text-[10px]">Machining & Thread Tapping</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U2 UCP</b><div class="text-slate-300 text-[10px]">Central Staging & QC Check</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">GUDANG JAYA</b><div class="text-slate-300 text-[10px]">Logistik Distribusi Utama</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">D30</b><div class="text-slate-300 text-[10px]">Raw Materials & Wire Rod</div></div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><b class="text-amber-400">U1</b><div class="text-slate-300 text-[10px]">Finished Goods & Delivery</div></div>
            </div>

        `
      },
      {
        badge: "BAB 7 • LIVE DATABASE INTEGRATION",
        title: "Integrasi Nyata Database `produksi` (176.673 Barang)",
        subtitle: "Terhubung Langsung ke Server MySQL via User Resmi usr_android",
        html: `
          <div class="space-y-4 text-slate-200 text-xs sm:text-sm leading-relaxed">
            <div class="p-4 rounded-2xl bg-emerald-950/30 border border-emerald-900/50 space-y-2 font-mono">
              <div class="flex items-center justify-between text-emerald-400 font-bold text-xs">
                <span>STATUS KONEKSI DATABASE PRODUKSI</span>
                <span class="bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800 text-[10px]">● AKTIF / TERKONEKSI</span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-xs pt-1 text-slate-300">
                <div>Server IP: <b class="text-slate-100">192.168.1.159:3306</b></div>
                <div>Database: <b class="text-emerald-300">produksi</b></div>
                <div>User Akses: <b class="text-slate-100">usr_android</b></div>
                <div>Total Data: <b class="text-amber-400 font-bold">176.673 Item</b></div>
              </div>
            </div>
            <p class="text-xs text-slate-300">
              Aplikasi ini terhubung langsung ke tabel master <code>item</code>, tabel lokasi <code>wip_lokasi_m</code>, dan <code>user_produksi</code>, sehingga pencarian kode barang dan data stok berlangsung secara instan dan akurat.
            </p>
          </div>
        `
      }
    ];

    let currentSlide = 0;

    function renderSlide() {
      const s = slides[currentSlide];
      const container = document.getElementById('slide-container');
      container.innerHTML = `
        <div>
          <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-blue-400 px-2.5 py-0.5 rounded bg-blue-950/60 border border-blue-900">
            \${s.badge}
          </span>
          <h2 class="text-lg sm:text-xl font-bold text-white mt-2.5 tracking-tight">
            \${s.title}
          </h2>
          <p class="text-xs sm:text-sm text-slate-400 mt-1">
            \${s.subtitle}
          </p>
        </div>
        <div class="py-3 flex-1">
          \${s.html}
        </div>
      `;

      document.getElementById('slide-tracker').innerText = `Bab \${currentSlide + 1} dari \${slides.length}`;
      document.getElementById('btn-prev').disabled = currentSlide === 0;

      const nextBtn = document.getElementById('btn-next');
      if (currentSlide === slides.length - 1) {
        nextBtn.innerText = 'Kembali ke Awal ↺';
      } else {
        nextBtn.innerText = 'Bab Berikutnya →';
      }

      // Render pills
      const pillsContainer = document.getElementById('pills-container');
      pillsContainer.innerHTML = slides.map((item, idx) => `
        <button
          onclick="goToSlide(\${idx})"
          class="px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all \${
            currentSlide === idx
              ? 'bg-blue-600 text-white shadow'
              : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'
          }"
        >
          Bab \${idx + 1}
        </button>
      `).join('');
    }

    function changeSlide(dir) {
      if (currentSlide === slides.length - 1 && dir === 1) {
        currentSlide = 0;
      } else {
        currentSlide = Math.max(0, Math.min(slides.length - 1, currentSlide + dir));
      }
      renderSlide();
    }

    function goToSlide(idx) {
      currentSlide = idx;
      renderSlide();
    }

    renderSlide();
  </script>
</body>
</html>
