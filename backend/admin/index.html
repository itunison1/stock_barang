<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMS Stock Opname — Portal Supervisor/Admin</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#050811;--bg-2:#0f172a;--txt:#e2e8f0;--muted:#94a3b8;--border:#1e293b;--accent:#0ea5e9;--accent-2:#06b6d4;--accent-3:#22c55e;--grad-accent:linear-gradient(135deg,#0ea5e9 0%,#06b6d4 50%,#22c55e 100%);--acc-glow:rgba(14,165,233,.25);--glass-bg:rgba(15,23,42,.7);--glass-brd:rgba(255,255,255,.08);--shadow-lg:0 20px 60px rgba(0,0,0,.4);--font-display:'Rajdhani',sans-serif;--danger:#f43f5e;--warn:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:1280px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:16px;margin-bottom:20px;backdrop-filter:blur(20px)}
header h1{font-family:var(--font-display);font-size:20px;font-weight:700}
header h1 span{color:var(--accent-2)}
.badge{font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 10px;border-radius:999px;background:rgba(14,165,233,.12);border:1px solid rgba(14,165,233,.3);color:var(--accent-2)}
.user-chip{display:flex;align-items:center;gap:10px;font-size:13px}
.user-chip .lvl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.35);color:var(--accent-3)}
.btn{cursor:pointer;border:none;border-radius:10px;font-weight:700;font-size:13px;padding:8px 16px;transition:.15s}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{color:var(--txt);border-color:var(--accent)}
.btn-primary{background:var(--grad-accent);color:#04121c}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{background:rgba(244,63,94,.15);border:1px solid rgba(244,63,94,.4);color:#fda4af}
.btn-danger:hover{background:rgba(244,63,94,.25)}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;gap:8px}
.tab.active{border-color:var(--accent);color:var(--accent-2);background:rgba(14,165,233,.1)}
.count-pill{font-size:10px;font-weight:800;background:var(--warn);color:#1c1300;padding:1px 7px;border-radius:999px}
.card{background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.item-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.item-card .body{padding:14px;display:flex;gap:12px}
.item-card img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:2px solid rgba(245,158,11,.4);cursor:pointer}
.item-card .meta{flex:1;font-size:12px;color:var(--muted)}
.item-card .meta b{color:var(--txt)}
.item-card .name{font-weight:700;color:#fff;font-size:13px;margin-bottom:4px}
.item-card .barcode{font-family:'JetBrains Mono',monospace;color:var(--accent-2);font-size:11px}
.item-card .actions{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.item-card .actions button{flex:1}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty i{font-size:32px;color:var(--accent-3);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-family:'JetBrains Mono',monospace}
.status-pill{font-size:9px;font-weight:800;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.st-REVIEW_REQUIRED,.st-pending{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.35)}
.st-RECOUNT_REQUIRED{background:rgba(168,85,247,.15);color:#c4b5fd;border:1px solid rgba(168,85,247,.35)}
.st-active,.st-APPROVED_RETURN,.st-APPROVED_TRANSFER{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.35)}
.st-rejected,.st-REJECTED{background:rgba(244,63,94,.15);color:#fda4af;border:1px solid rgba(244,63,94,.35)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
.modal h3{font-family:var(--font-display);font-size:17px;margin-bottom:14px}
.modal textarea,.modal select,.modal input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--txt);font-size:13px;margin-bottom:12px;font-family:inherit}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg-2);border:1px solid var(--border);border-left:4px solid var(--accent-3);border-radius:10px;padding:12px 18px;font-size:13px;z-index:100;box-shadow:var(--shadow-lg);animation:fadeUp .2s ease}
.toast.err{border-left-color:var(--danger)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.zoom-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.zoom-bg img{max-width:90vw;max-height:90vh;border-radius:8px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
